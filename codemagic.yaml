workflows:
  ios-workflow:
    name: Leave Her Johnny iOS Build
    integrations:
      app_store_connect: Scheidel Holdings LLC
    environment:
      xcode: latest
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing
        # The App Store Connect integration injects the API key + certificate
        # private key as env vars, so the CLI tools below authenticate with no
        # extra config. fetch-signing-files with --create generates the
        # distribution profile for this bundle id if it doesn't exist yet
        # (a plain `xcode-project use-profiles` only fetches existing ones,
        # which is why the first build failed with "No matching profiles found").
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.scheidelholdings.leaveherjohnny" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number from timestamp
        script: |
          cd $CM_BUILD_DIR/ios/App
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
