workflows:
  ios-workflow:
    name: Leave Her Johnny iOS Build
    integrations:
      app_store_connect: Scheidel Holdings LLC
    environment:
      xcode: latest
      node: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scheidelholdings.leaveherjohnny
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Apply code signing profiles
        # Matches DTMB's proven recipe. The ios_signing environment block
        # (above) does the full manual-signing wiring for the archive; this
        # step applies the fetched App Store profile to the project. The
        # profile now exists in the account (created by the earlier
        # fetch-signing-files --create run), so the block can find it.
        script: |
          xcode-project use-profiles
      - name: Set build number from timestamp
        script: |
          cd $CM_BUILD_DIR/ios/App
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
