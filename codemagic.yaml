workflows:
  ios-workflow:
    name: Leave Her Johnny iOS Build
    integrations:
      app_store_connect: Scheidel Holdings LLC
    environment:
      xcode: latest
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing
        # Explicit automatic-signing recipe + diagnostics. fetch-signing-files
        # --create gets/creates the profile, use-profiles writes signing into
        # the project. The diagnostics + guard below print the installed
        # profiles and the project's RESOLVED signing settings, then stop the
        # build here (with everything visible) if no profile got wired -- so
        # we can finally see WHY the archive says "requires a provisioning
        # profile" instead of guessing from the downstream Build IPA error.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.scheidelholdings.leaveherjohnny" \
            --type IOS_APP_STORE \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose
          echo "================ SIGNING DIAGNOSTICS ================"
          echo "--- Provisioning profiles installed on runner ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "(none)"
          echo "--- Resolved Release signing settings for App target ---"
          SETTINGS=$(xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings 2>/dev/null || true)
          echo "$SETTINGS" | grep -iE "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|PRODUCT_BUNDLE_IDENTIFIER" || echo "(no signing settings resolved)"
          echo "===================================================="
          if ! echo "$SETTINGS" | grep -qiE "PROVISIONING_PROFILE_SPECIFIER = [A-Za-z0-9]"; then
            echo "STOPPING: use-profiles did not wire a provisioning profile into the App target."
            echo "Build IPA would fail with 'requires a provisioning profile'. See output above."
            exit 1
          fi
          echo "Signing is wired. Proceeding to build."
      - name: Set build number from timestamp
        script: |
          cd $CM_BUILD_DIR/ios/App
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
