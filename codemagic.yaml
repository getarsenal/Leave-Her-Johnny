workflows:
  ios-workflow:
    name: Leave Her Johnny iOS Build
    integrations:
      app_store_connect: Scheidel Holdings LLC
    environment:
      xcode: latest
      node: latest
      # DTMB's proven mechanism: makes Codemagic install the managed
      # distribution CERTIFICATE from the integration and fetch matching
      # profiles before scripts run. The explicit fetch-signing-files CLI
      # could not do this (no CERTIFICATE_PRIVATE_KEY -> no cert -> no
      # profiles). Now that a profile exists for this bundle id, the block
      # has both the cert and the profile.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scheidelholdings.leaveherjohnny
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Apply code signing profiles
        # The ios_signing block (above) already installed the certificate and
        # fetched profiles; this applies them to the project. Diagnostics +
        # guard kept so we get a clear readout if anything is still unwired.
        script: |
          xcode-project use-profiles --verbose
          echo "================ SIGNING DIAGNOSTICS ================"
          echo "--- Provisioning profiles installed on runner ---"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "(none)"
          echo "--- Resolved Release signing settings for App target ---"
          SETTINGS=$(xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -showBuildSettings 2>/dev/null || true)
          echo "$SETTINGS" | grep -iE "CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER|CODE_SIGN_IDENTITY|PRODUCT_BUNDLE_IDENTIFIER" || echo "(no signing settings resolved)"
          echo "===================================================="
          if ! echo "$SETTINGS" | grep -qiE "PROVISIONING_PROFILE_SPECIFIER = [A-Za-z0-9]"; then
            echo "STOPPING: use-profiles did not wire a provisioning profile into the App target."
            echo "Build IPA would fail with 'requires a provisioning profile'. See output above."
            exit 1
          fi
          echo "Signing is wired. Proceeding to build."
      - name: Set build number from timestamp
        script: |
          cd $CM_BUILD_DIR/ios/App
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
