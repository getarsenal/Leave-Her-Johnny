workflows:
  ios-workflow:
    name: Leave Her Johnny iOS Build
    integrations:
      app_store_connect: Scheidel Holdings LLC
    environment:
      xcode: latest
      node: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: Set up code signing
        # Explicit automatic-signing recipe (Codemagic sample). This got the
        # build all the way to the Archive step, unlike the ios_signing block
        # which fails earlier with "No matching profiles found". --verbose so
        # the log shows whether the profile is created, fetched, or skipped.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.scheidelholdings.leaveherjohnny" \
            --type IOS_APP_STORE \
            --create \
            --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose
      - name: Set build number from timestamp
        script: |
          cd $CM_BUILD_DIR/ios/App
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
